name: Tests

# CI for flutter_rtsps_plugin. Two jobs:
#
#   dart-tests — analyze + the Dart unit tests. Cheap, runs on Linux.
#   ios-tests  — the Swift suite (10 files, ~85 cases) on a simulator.
#
# Added Sept 2026: this repo had no CI at all. It is a submodule of the
# PandaWatch app, which gates its own trees but cannot see this one, so the
# native RTSP/H.264 logic — jitter buffer, RTP depacketiser, access-unit
# assembler, SDP parser — had no automated verification despite being the most
# intricate code in either repo and carrying a SwiftCheck property-test suite.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-tests:
    name: Dart Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      # Covers the plugin and the example app (analysis_options.yaml at the repo
      # root applies to both).
      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  ios-tests:
    name: iOS Tests
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The Swift tests live in a SwiftPM package (ios/flutter_rtsps_plugin)
      # whose sources `import Flutter`, so `swift test` cannot build them: the
      # package's FlutterFramework path dependency is a generated stub and the
      # real Flutter module only exists inside a configured Flutter iOS build.
      # Running the example app's build is what makes the module resolvable.
      - name: Flutter pub get (example)
        working-directory: example
        run: flutter pub get

      # Generates ios/Flutter/ephemeral (including the FlutterFramework SwiftPM
      # stub) and runs pod install. --config-only stops before compiling the app,
      # which is all we need: it only has to produce the Xcode configuration.
      - name: Configure iOS build
        working-directory: example
        run: flutter build ios --config-only --no-codesign

      # Pick a simulator by UDID rather than hardcoding a device name, which
      # drifts between runner images. Matches on deviceTypeIdentifier rather
      # than the display name, since the name is freely editable.
      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devices in data.items():
              if '.SimRuntime.iOS-' not in runtime:
                  continue
              for d in devices:
                  if not d.get('isAvailable'):
                      continue
                  if 'iPhone' in d.get('deviceTypeIdentifier', '') or 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          sys.exit('no available iPhone simulator found')
          ")
          if [ -z "$UDID" ]; then
            echo "::error::Could not resolve an iOS simulator UDID"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

          # Boot ahead of xcodebuild and wait for the device to be ready.
          # Letting xcodebuild boot it on demand is a common source of
          # "failed to launch" errors on cold CI runners.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # The Runner scheme's test action picks up both the example app's
      # RunnerTests target and the plugin's SwiftPM test target, because Flutter
      # resolves the plugin as a local SwiftPM package in the workspace. Running
      # through the workspace means Flutter's own tooling links Flutter.framework,
      # so no manual framework search paths are needed.
      #
      # Parallel testing is disabled deliberately. By default xcodebuild spawns
      # simulator clones ("Clone 2 of iPhone 16 Pro") and runs suites across
      # them; on CI a clone intermittently fails to launch the host app
      # (FBSOpenApplicationServiceErrorDomain Code=1), which surfaced as two
      # unrelated tests failing while the other 83 passed. Running on the single
      # booted device is slower but deterministic.
      - name: Run iOS tests
        working-directory: example/ios
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO \
            | tee /tmp/xcodebuild.log

      # Guard against the suite silently shrinking. The plugin's Swift tests are
      # only discovered while it resolves as a local SwiftPM package; if that
      # changes, xcodebuild would still exit 0 having run just the single
      # RunnerTests case, and the job would stay green while covering almost
      # nothing. Assert the real suites ran.
      #
      # xcodebuild has two result formats and they are not interchangeable:
      #   serial:   Test Case '-[BundleName.SuiteName testName]' passed
      #   parallel: Test case 'SuiteName.testName()' passed on 'Clone 1 of ...'
      # A single loose regex mis-parses one or the other (in the parallel form
      # the leading token is the suite, in the serial form it is the bundle), so
      # both are matched explicitly.
      - name: Verify expected test suites ran
        run: |
          python3 <<'PY'
          import re, sys

          EXPECTED = {
              "AccessUnitAssemblerPropertyTests",
              "BugConditionExplorationTests",
              "H264DecoderPropertyTests",
              "JitterBufferConfigPropertyTests",
              "JitterBufferPropertyTests",
              "PreservationTests",
              "ReconnectionManagerPropertyTests",
              "RtpDemuxerPropertyTests",
              "RtpDemuxerTests",
              "RunnerTests",
              "SdpParserTests",
          }
          MIN_CASES = 70  # 85 today; floored so routine test churn does not trip it

          serial = re.compile(r"Test Case '-\[\w+\.(\w+) \w+\]' (passed|failed)")
          parallel = re.compile(r"Test case '(\w+)\.\w+\(\)' (passed|failed)")

          seen, passed, failed = {}, 0, 0
          with open("/tmp/xcodebuild.log", errors="replace") as fh:
              for line in fh:
                  m = serial.search(line) or parallel.search(line)
                  if not m:
                      continue
                  suite, outcome = m.group(1), m.group(2)
                  seen.setdefault(suite, 0)
                  seen[suite] += 1
                  if outcome == "passed":
                      passed += 1
                  else:
                      failed += 1

          for suite in sorted(seen):
              print(f"  {suite}: {seen[suite]} cases")
          print(f"total passed={passed} failed={failed} suites={len(seen)}")

          errors = []
          missing = EXPECTED - seen.keys()
          if missing:
              errors.append("expected test suites did not run: " + ", ".join(sorted(missing)))
          if failed:
              errors.append(f"{failed} test case(s) failed")
          if passed < MIN_CASES:
              errors.append(
                  f"only {passed} cases ran, expected at least {MIN_CASES}; "
                  "the Swift suite may not be building"
              )
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY
